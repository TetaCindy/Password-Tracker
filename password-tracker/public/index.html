<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Expiry Tracker</title>
<style>
  :root{
    --navy:#1c2b3a;
    --steel:#2f4858;
    --accent:#3f8efc;
    --ok:#2e9e5b;
    --warn:#e0a11e;
    --danger:#d84343;
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#1c2b3a;
    --muted:#6b7a89;
    --border:#e1e6ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:32px 16px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:12px;
  }
  h1{font-size:1.5rem;margin:0;color:var(--navy);}
  .sub{color:var(--muted);font-size:0.9rem;margin-top:4px;}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 18px;
    min-width:120px;
    flex:1;
  }
  .stat .num{font-size:1.6rem;font-weight:700;}
  .stat .label{font-size:0.78rem;color:var(--muted);margin-top:2px;}
  .stat.ok .num{color:var(--ok);}
  .stat.warn .num{color:var(--warn);}
  .stat.danger .num{color:var(--danger);}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
  }
  .card h2{font-size:1rem;margin:0 0 14px 0;color:var(--steel);}

  form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:0.75rem;color:var(--muted);}
  .field input, .field select{
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:0.9rem;
    min-width:150px;
  }
  button{
    background:var(--accent);
    color:white;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:0.9rem;
    cursor:pointer;
  }
  button:hover{opacity:0.9;}
  button:disabled{opacity:0.6;cursor:not-allowed;}
  button.ghost{
    background:transparent;
    color:var(--steel);
    border:1px solid var(--border);
  }

  table{width:100%;border-collapse:collapse;font-size:0.88rem;}
  th, td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.03em;}
  tr:last-child td{border-bottom:none;}

  .badge{
    display:inline-block;
    padding:3px 10px;
    border-radius:999px;
    font-size:0.75rem;
    font-weight:600;
  }
  .badge.ok{background:#e5f6ec;color:var(--ok);}
  .badge.warn{background:#fdf1dc;color:var(--warn);}
  .badge.danger{background:#fbe7e7;color:var(--danger);}

  .row-actions{display:flex;gap:6px;}
  .row-actions button{padding:5px 10px;font-size:0.78rem;}

  .empty{text-align:center;color:var(--muted);padding:30px 0;}
  .error{color:var(--danger);font-size:0.85rem;margin-top:8px;}

  .toast{
    position:fixed;
    bottom:24px;
    right:24px;
    background:var(--navy);
    color:white;
    padding:12px 18px;
    border-radius:8px;
    font-size:0.88rem;
    opacity:0;
    transform:translateY(10px);
    transition:all 0.25s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Password Expiry Tracker</h1>
      <div class="sub">Agent password status at a glance</div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>Add agent</h2>
    <form id="addForm">
      <div class="field">
        <label>Agent name</label>
        <input type="text" id="name" placeholder="e.g. Uwase Divine" required>
      </div>
      <div class="field">
        <label>Last password change</label>
        <input type="date" id="changed" required>
      </div>
      <div class="field">
        <label>Expiry policy (days)</label>
        <select id="policy">
          <option value="30">30 days</option>
          <option value="60">60 days</option>
          <option value="90" selected>90 days</option>
        </select>
      </div>
      <button type="submit" id="addBtn">Add agent</button>
    </form>
    <div class="error" id="formError"></div>
  </div>

  <div class="card">
    <h2>Agents</h2>
    <table id="table">
      <thead>
        <tr>
          <th>Agent</th>
          <th>Last changed</th>
          <th>Expires on</th>
          <th>Days left</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyState" class="empty" style="display:none;">No agents added yet. Add one above to get started.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATUS_LABELS = {
  ok: { label: "OK", cls: "ok" },
  due_soon: { label: "Due soon", cls: "warn" },
  expiring_soon: { label: "Expires soon", cls: "danger" },
  expired: { label: "Expired", cls: "danger" },
};

function formatDate(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
}

async function fetchAgents(){
  const res = await fetch("/api/agents");
  if (!res.ok) throw new Error("Could not load agents");
  return res.json();
}

async function loadAndRender(){
  try{
    const agents = await fetchAgents();
    render(agents);
  }catch(err){
    document.getElementById("tbody").innerHTML = "";
    document.getElementById("emptyState").style.display = "block";
    document.getElementById("emptyState").textContent = "Could not load agents. Is the server running?";
  }
}

function render(agents){
  const tbody = document.getElementById("tbody");
  const empty = document.getElementById("emptyState");
  tbody.innerHTML = "";

  if (agents.length === 0){
    empty.style.display = "block";
    empty.textContent = "No agents added yet. Add one above to get started.";
  } else {
    empty.style.display = "none";
  }

  let okCount = 0, warnCount = 0, dangerCount = 0;

  agents.forEach(agent => {
    const statusInfo = STATUS_LABELS[agent.status];
    if (agent.status === "ok") okCount++;
    else if (agent.status === "due_soon") warnCount++;
    else dangerCount++;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${agent.name}</td>
      <td>${formatDate(agent.changed)}</td>
      <td>${formatDate(agent.expiry)}</td>
      <td>${agent.daysLeft < 0 ? "Expired" : agent.daysLeft + "d"}</td>
      <td><span class="badge ${statusInfo.cls}">${statusInfo.label}</span></td>
      <td>
        <div class="row-actions">
          <button class="ghost" data-action="remind" data-id="${agent.id}">Remind</button>
          <button class="ghost" data-action="reset" data-id="${agent.id}">Reset</button>
          <button class="ghost" data-action="remove" data-id="${agent.id}">Remove</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("stats").innerHTML = `
    <div class="stat ok"><div class="num">${okCount}</div><div class="label">OK</div></div>
    <div class="stat warn"><div class="num">${warnCount}</div><div class="label">Due soon</div></div>
    <div class="stat danger"><div class="num">${dangerCount}</div><div class="label">Expiring / expired</div></div>
  `;
}

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

document.getElementById("tbody").addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;

  try{
    if (action === "remind"){
      const res = await fetch(`/api/agents/${id}/remind`, { method: "POST" });
      const data = await res.json();
      showToast(data.message);
    } else if (action === "reset"){
      await fetch(`/api/agents/${id}/reset`, { method: "PUT" });
      await loadAndRender();
      showToast("Password marked as reset today");
    } else if (action === "remove"){
      await fetch(`/api/agents/${id}`, { method: "DELETE" });
      await loadAndRender();
      showToast("Agent removed");
    }
  }catch(err){
    showToast("Something went wrong. Please try again.");
  }
});

document.getElementById("addForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const changed = document.getElementById("changed").value;
  const policy = document.getElementById("policy").value;
  const errorEl = document.getElementById("formError");
  const addBtn = document.getElementById("addBtn");
  errorEl.textContent = "";

  if (!name || !changed){
    errorEl.textContent = "Please fill in the agent name and last change date.";
    return;
  }

  addBtn.disabled = true;
  try{
    const res = await fetch("/api/agents", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, changed, policy }),
    });
    if (!res.ok){
      const data = await res.json();
      throw new Error(data.error || "Could not add agent");
    }
    await loadAndRender();
    showToast(`${name} added`);
    e.target.reset();
    document.getElementById("policy").value = "90";
  }catch(err){
    errorEl.textContent = err.message;
  }finally{
    addBtn.disabled = false;
  }
});

loadAndRender();
</script>
</body>
</html>
